name: Telegram bot

on:
  schedule:
    - cron: "0 */5 * * *"   # новая смена каждые 5 часов
  workflow_dispatch:         # ручной запуск из вкладки Actions
  push:
    branches: [main]
    paths: ["bot/**", ".github/workflows/bot.yml"]

# новая смена сразу заменяет старую, чтобы бот не работал в двух копиях
concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBAPP_URL: https://uwqm.github.io/crystal-mines/
          RUN_SECONDS: "20700"
          PYTHONUNBUFFERED: "1"
        run: python bot/bot.py
