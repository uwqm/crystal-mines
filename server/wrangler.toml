name = "crystal-mines"
main = "src/worker.js"
compatibility_date = "2025-10-01"
account_id = "03b20ce0f3cc2a4a87b859d769f738cf"
workers_dev = true

[vars]
WEBAPP_URL = "https://uwqm.github.io/crystal-mines/"

[[d1_databases]]
binding = "DB"
database_name = "crystal-mines"
database_id = "f48c1b81-1ecc-47c1-9e37-253cec7b3545"

[observability]
enabled = true

# ограничение частоты запросов на игрока (общее для всех серверов Cloudflare)
[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 40, period = 10 }
